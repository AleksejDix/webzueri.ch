query home {
  events(orderBy: date_DESC, first: 1, where: { talks_some: {} }) {
    id
    date
    time
    title
    meetupLink
    talks {
      id
      name
      speakers {
        id
        name
        speakerPicture {
          url
        }
      }
    }
    venue {
      name
      city
    }
  }
  recent: talks(orderBy: createdAt_DESC, first: 40) {
    id
    speakers {
      id
      name
      speakerPicture {
        url
      }
    }
  }
  sponsors {
    id
    name
    website
    logo {
      url
      mimeType
    }
    events(first: 1000) {
      id
      date
    }
  }
  talksConnection {
    aggregate {
      count
    }
  }
  speakersConnection(where: { talks_some: {} }) {
    aggregate {
      count
    }
  }
  eventsConnection(where: { talks_some: {} }) {
    aggregate {
      count
    }
  }
  # Where speakers worked when they gave their talk, for the "speakers from" names under the hero
  speakerCompanies: speakers(first: 1000, where: { talks_some: {}, name_not: "Organising team" }) {
    company
  }
  firstEvent: events(orderBy: date_ASC, first: 1, where: { talks_some: {} }) {
    date
  }
}
