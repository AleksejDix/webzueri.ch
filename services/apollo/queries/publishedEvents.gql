# Every meetup, past and upcoming; the page splits them by today's date in the browser
query events {
  events(orderBy: date_DESC, first: 1000) {
    id
    date
    time
    title
    eventType
    meetupLink
    streamLink
    venue {
      name
      city
      googleMapsUrl
    }
    talks {
      id
      name
      youtubecode
      category
      speakers {
        id
        name
        speakerPicture {
          url
        }
      }
    }
    sponsors {
      id
      name
      website
      logo {
        url
      }
    }
  }
}
