query speakers {
  speakers(
    first: 1000
    # Everyone who has given a talk; "Organising team" is a placeholder, not a person
    where: { talks_some: {}, name_not: "Organising team" }
  ) {
    id
    name
    role
    company
    speakerPicture {
      url
      handle
      fileName
    }
    talks(orderBy: createdAt_DESC) {
      id
      name
      youtubecode
      createdAt
      event {
        date
      }
    }
  }
}
